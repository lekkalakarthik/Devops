```yaml
name: Terraform and Docker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================================
  # JOB 1 - Terraform
  # ==========================================================
  terraform:
    name: Terraform Azure VM
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.ARM_CLIENT_SECRET }}

      # ------------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------
      - name: Terraform Init
        working-directory: Terraform/AzureVm
        run: terraform init

      # ------------------------------------------------------
      # Terraform Format
      # ------------------------------------------------------
      - name: Terraform Format
        working-directory: Terraform/AzureVm
        run: terraform fmt -check

      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------
      - name: Terraform Validate
        working-directory: Terraform/AzureVm
        run: terraform validate

      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------
      - name: Terraform Plan
        working-directory: Terraform/AzureVm
        run: |
          terraform plan \
            -var="ssh_public_key_path=${{ github.workspace }}/keys/id_rsa.pub" \
            -out=tfplan

      # ------------------------------------------------------
      # Terraform Apply
      # ------------------------------------------------------
      - name: Terraform Apply
        working-directory: Terraform/AzureVm
        run: terraform apply -auto-approve tfplan


  # ==========================================================
  # JOB 2 - Docker Build and Push
  # ==========================================================
  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Login to Docker Hub
      # ------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------------------
      # Build Docker Image
      # ------------------------------------------------------
      - name: Build Docker Image
        working-directory: DokerApp
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest \
            .

      # ------------------------------------------------------
      # Push Docker Image
      # ------------------------------------------------------
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
```
